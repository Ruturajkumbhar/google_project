apiVersion: apps/v1
kind: Deployment
metadata:
  name: googleclothes-deployment
  labels:
    app: googleclothes
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googleclothes
  template:
    metadata:
      labels:
        app: googleclothes
    spec:
      containers:
      - name: googleclothes
        image: 233422680010.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googleclothes:588b5a89841eed19ef8d98a4ea4f274b0277ebd3
        ports:
        - containerPort: 80
