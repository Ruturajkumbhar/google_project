apiVersion: apps/v1
kind: Deployment
metadata:
  name: googlepay-deployment
  labels:
    app: googlepay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: googlepay
  template:
    metadata:
      labels:
        app: googlepay
    spec:
      containers:
      - name: googlepay
        image: 233422680010.dkr.ecr.us-east-1.amazonaws.com/shopping-site-googlepay:dfb2662d0987865778c7e2345cfdbbb804cba65a
        ports:
        - containerPort: 80
