apiVersion: apps/v1
kind: Deployment
metadata:
  name: main-frontend-deployment
  labels:
    app: main-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: main-frontend
  template:
    metadata:
      labels:
        app: main-frontend
    spec:
      containers:
      - name: main-frontend
        image: 233422680010.dkr.ecr.us-east-1.amazonaws.com/shopping-site-main:076c12535dfff69df77fe59e5bdd63718c89ada1
        ports:
        - containerPort: 80

