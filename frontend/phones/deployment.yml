apiVersion: apps/v1
kind: Deployment
metadata:
  name: phones-deployment
  labels:
    app: phones
spec:
  replicas: 2
  selector:
    matchLabels:
      app: phones
  template:
    metadata:
      labels:
        app: phones
    spec:
      containers:
      - name: phones
        image: 233422680010.dkr.ecr.us-east-1.amazonaws.com/shopping-site-phones:f2e50940d9a2b3d142cab6d92a44c1f4370b18d4
        ports:
        - containerPort: 80
